    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="assets/favicon.ico" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-white text-black">
    <!-- Navigation -->
    <nav
      class="fixed top-0 w-full bg-white border-b border-gray-200 px-4 py-4 sm:p-6 z-10"
    >
      <div class="container mx-auto flex justify-between items-center">
        <a
          href="index.html"
          class="text-lg sm:text-xl font-serif whitespace-nowrap"
          >Lado Oniani</a
        >
        <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <ul class="nav-links flex space-x-3 sm:space-x-8">
          <li><a href="index.html" class="hover:underline">Home</a></li>
          <li><a href="archive.html" class="hover:underline">Archive</a></li>
          <li><a href="info.html" class="hover:underline">About</a></li>
          <li><a href="contact.html" class="hover:underline">Contact</a></li>
        </ul>
      </div>
    </nav>
    <script>
      (function () {
        const btn = document.querySelector(".nav-toggle");
        const links = document.querySelector(".nav-links");
        if (!btn || !links) return;
        btn.addEventListener("click", function () {
          const open = links.classList.toggle("is-open");
          btn.classList.toggle("is-open", open);
          btn.setAttribute("aria-expanded", open);
          btn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
        });
        links.querySelectorAll("a").forEach(function (a) {
          a.addEventListener("click", function () {
            links.classList.remove("is-open");
            btn.classList.remove("is-open");
            btn.setAttribute("aria-expanded", "false");
            btn.setAttribute("aria-label", "Open menu");
          });
        });
      })();
    </script>

    <!-- Hero Section -->
    <section class="min-h-screen flex items-center justify-center">
      <div class="container mx-auto text-center">
        <h1 class="text-4xl font-serif mb-4">Lado Oniani</h1>
        <p class="text-base mb-8">Artist, Musician | Tbilisi, Georgia</p>
        <a href="archive.html" class="underline hover:opacity-75"
          >Explore Archive</a
        >
      </div>
    </section>
  </body>
