<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lado Oniani</title>
    <meta
      name="description"
      content="Archives of art, music and engineering."
    />
    <meta property="og:title" content="Lado Oniani" />
    <meta
      property="og:description"
      content="Archives of art, music and engineering."
    />
    <meta property="og:url" content="https://ladooniani.art" />
    <meta property="og:type" content="website" />
    <link rel="shortcut icon" href="portfolio/assets/favicon.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Times New Roman", Times, serif;
        line-height: 1.8;
        letter-spacing: 0.02em;
      }
      .card {
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
      }
      .card:hover {
        opacity: 0.85;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body class="bg-white text-black min-h-screen flex flex-col">
    <main class="flex-1 flex items-center justify-center px-4 py-16">
      <div class="container mx-auto max-w-3xl text-center">
        <h1 class="text-4xl md:text-5xl font-serif mb-3">Lado Oniani</h1>
        <p class="text-base text-gray-600 mb-16">Art · Music · Engineering</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12">
          <!-- Artist Portfolio -->
          <a
            href="portfolio/"
            class="card block border border-gray-200 p-8 hover:border-black"
          >
            <h2 class="text-xl font-serif mb-3">Artist Portfolio</h2>
            <p class="text-sm text-gray-600 leading-relaxed">
              Archive, art, exhibitions, music and multidisciplinary practice.
            </p>
            <p class="mt-6 text-sm underline">Enter portfolio →</p>
          </a>

          <!-- Software / Research -->
          <a
            href="software/"
            class="card block border border-gray-200 p-8 hover:border-black"
          >
            <h2 class="text-xl font-serif mb-3">Technology</h2>
            <p class="text-sm text-gray-600 leading-relaxed">
              Software and mechanical engineering, industrial design research
              labs.
            </p>
            <p class="mt-6 text-sm underline">Enter technology →</p>
          </a>
        </div>

        <p class="mt-20 text-xs text-gray-400">
          © <span id="year"></span> Lado Oniani
        </p>
      </div>
    </main>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
